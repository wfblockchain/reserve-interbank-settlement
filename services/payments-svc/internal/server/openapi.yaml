# Generated with protoc-gen-openapi
# https://github.com/google/gnostic/tree/master/cmd/protoc-gen-openapi

openapi: 3.0.3
info:
    title: Reserve interbank settlement payment hub API
    version: 1.0.0
paths:
    /v1/account:
        get:
            tags:
                - AccountService
            description: GetAccount returns the organization's deposit account.
            operationId: AccountService_GetAccount
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Account'
    /v1/account/statement:
        get:
            tags:
                - AccountService
            description: ListStatementEntries returns the account's postings.
            operationId: AccountService_ListStatementEntries
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.ListStatementEntriesResponse'
    /v1/account/statement/camt053:
        get:
            tags:
                - AccountService
            description: GetStatement renders the account statement as a camt.053.001.08.
            operationId: AccountService_GetStatement
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Document'
    /v1/me:
        get:
            tags:
                - AccountService
            description: WhoAmI returns the authenticated person and entitlements.
            operationId: AccountService_WhoAmI
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Principal'
    /v1/network/participants:
        get:
            tags:
                - PaymentService
            description: ListParticipants lists the banks on the network and whether each is live.
            operationId: PaymentService_ListParticipants
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.ListParticipantsResponse'
    /v1/operator/clock:
        post:
            tags:
                - NetworkOperationsService
            description: |-
                SetClock moves the scenario clock (and the chain's) forward. Demo builds
                 only; a production build answers PERMISSION_DENIED.
            operationId: NetworkOperationsService_SetClock
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.SetClockRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.SetClockResponse'
    /v1/operator/interest-distributions:
        post:
            tags:
                - NetworkOperationsService
            description: |-
                DistributeInterest passes interest the Fed paid on the reserve account
                 to holders of settlement money through the accrual index, and pays each
                 member over Fedwire (412 while Fedwire is closed).
            operationId: NetworkOperationsService_DistributeInterest
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.DistributeInterestRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.InterestDistribution'
    /v1/operator/netting-cycles:
        post:
            tags:
                - NetworkOperationsService
            description: |-
                RunNettingCycle plans the largest feasible set of queued obligations
                 and settles it through the plan book now.
            operationId: NetworkOperationsService_RunNettingCycle
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.RunNettingCycleRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.NettingCycle'
    /v1/operator/network:
        get:
            tags:
                - NetworkOperationsService
            description: |-
                GetNetwork returns members, the reserve account, the pool, cycles,
                 reconciliations and interest distributions.
            operationId: NetworkOperationsService_GetNetwork
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Network'
    /v1/operator/reconciliations:
        post:
            tags:
                - NetworkOperationsService
            description: |-
                Reconcile attests the Fed's camt.052 balance for the reserve account
                 against the token's reserve pool.
            operationId: NetworkOperationsService_Reconcile
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.ReconcileRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Reconciliation'
    /v1/ops/defunds:
        post:
            tags:
                - BankOperationsService
            description: |-
                RequestDefund asks for settlement money back to the master account as
                 reserves (maker); the amount is earmarked at once.
            operationId: BankOperationsService_RequestDefund
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.RequestDefundRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Defund'
    /v1/ops/defunds/{id}/approve:
        post:
            tags:
                - BankOperationsService
            description: ApproveDefund is the checker; never the requester, always the same bank.
            operationId: BankOperationsService_ApproveDefund
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.ApproveDefundRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Defund'
    /v1/ops/funding:
        post:
            tags:
                - BankOperationsService
            description: |-
                FundSettlement sends reserves into the reserve account and the operator
                 issues settlement money against them: Fedwire BTRC while Fedwire is open,
                 FedNow LMT1 while it is closed.
            operationId: BankOperationsService_FundSettlement
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.FundSettlementRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.FundSettlementResponse'
    /v1/ops/holds:
        get:
            tags:
                - BankOperationsService
            description: |-
                ListHolds lists payments held for sanctions review, and blocked or
                 rejected cases with their OFAC report dates.
            operationId: BankOperationsService_ListHolds
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.ListHoldsResponse'
    /v1/ops/holds/{id}/block:
        post:
            tags:
                - BankOperationsService
            description: |-
                BlockHold: a sanctioned party has an interest in the funds. They move to
                 the bank's blocked account (BLCK) and a report is due to OFAC within 10
                 business days (31 CFR 501.603).
            operationId: BankOperationsService_BlockHold
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.HoldDecisionRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Payment'
    /v1/ops/holds/{id}/reject:
        post:
            tags:
                - BankOperationsService
            description: |-
                RejectHold: prohibited, but no sanctioned party has an interest. Nothing
                 moves (RR04); reported within 10 business days (31 CFR 501.604).
            operationId: BankOperationsService_RejectHold
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.HoldDecisionRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Payment'
    /v1/ops/holds/{id}/release:
        post:
            tags:
                - BankOperationsService
            description: ReleaseHold clears a false positive; the payment proceeds.
            operationId: BankOperationsService_ReleaseHold
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.HoldDecisionRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Payment'
    /v1/ops/intraday-draws:
        post:
            tags:
                - BankOperationsService
            description: |-
                DrawIntraday borrows settlement money from the intraday pool against
                 collateral at the pool's advance rate; payments waiting for liquidity
                 then proceed.
            operationId: BankOperationsService_DrawIntraday
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.DrawIntradayRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.DrawIntradayResponse'
    /v1/ops/intraday-draws/{id}/repay:
        post:
            tags:
                - BankOperationsService
            description: RepayIntraday repays a draw with its interest; the collateral returns.
            operationId: BankOperationsService_RepayIntraday
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.RepayIntradayRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.IntradayDraw'
    /v1/ops/liquidity:
        get:
            tags:
                - BankOperationsService
            description: |-
                GetLiquidity returns the bank's settlement money, intraday draws,
                 alerts, payments waiting for liquidity and defunds.
            operationId: BankOperationsService_GetLiquidity
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Liquidity'
    /v1/ops/payments:
        get:
            tags:
                - BankOperationsService
            description: ListBankPayments lists the bank's clients' payments, with staff detail.
            operationId: BankOperationsService_ListBankPayments
            parameters:
                - name: status
                  in: query
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.ListBankPaymentsResponse'
    /v1/ops/payments/{id}:
        get:
            tags:
                - BankOperationsService
            description: GetBankPayment returns one of the bank's clients' payments, with staff detail.
            operationId: BankOperationsService_GetBankPayment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Payment'
    /v1/payees/verify:
        post:
            tags:
                - PaymentService
            description: |-
                VerifyPayee asks the receiving bank whether an account is open and the
                 name matches its records.
            operationId: PaymentService_VerifyPayee
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.Party'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.PayeeCheck'
    /v1/payment-files:
        post:
            tags:
                - PaymentService
            description: |-
                SubmitPaymentFile accepts a pain.001.001.10 customer credit transfer
                 initiation. Each transaction becomes a payment awaiting approval; the
                 answer carries the file-level pain.002.
            operationId: PaymentService_SubmitPaymentFile
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.SubmitPaymentFileRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.PaymentFile'
    /v1/payment-files/{id}/pain002:
        get:
            tags:
                - PaymentService
            description: GetPaymentFileStatusReport renders a file's current pain.002.001.11.
            operationId: PaymentService_GetPaymentFileStatusReport
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Document'
    /v1/payments:
        get:
            tags:
                - PaymentService
            description: ListPayments lists the caller's organization's payments, newest first.
            operationId: PaymentService_ListPayments
            parameters:
                - name: status
                  in: query
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.ListPaymentsResponse'
        post:
            tags:
                - PaymentService
            description: CreatePayment records a payment order from a maker.
            operationId: PaymentService_CreatePayment
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.CreatePaymentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.CreatePaymentResponse'
    /v1/payments/{id}:
        get:
            tags:
                - PaymentService
            description: GetPayment returns one payment with its audit trail.
            operationId: PaymentService_GetPayment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Payment'
    /v1/payments/{id}/approve:
        post:
            tags:
                - PaymentService
            description: |-
                ApprovePayment records an approval. The maker can never approve its own
                 payment; each approver counts once.
            operationId: PaymentService_ApprovePayment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.ApprovePaymentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Payment'
    /v1/payments/{id}/cancel:
        post:
            tags:
                - PaymentService
            description: |-
                CancelPayment withdraws a payment not yet approved (its maker), or pulls
                 a NORMAL payment from the netting queue before its cycle runs.
            operationId: PaymentService_CancelPayment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.CancelPaymentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Payment'
    /v1/payments/{id}/decline:
        post:
            tags:
                - PaymentService
            description: DeclinePayment is an approver refusing a payment.
            operationId: PaymentService_DeclinePayment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.DeclinePaymentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Payment'
    /v1/payments/{id}/pain002:
        get:
            tags:
                - PaymentService
            description: GetPaymentStatusReport renders the payment's status as a pain.002.001.11.
            operationId: PaymentService_GetPaymentStatusReport
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Document'
    /v1/webhooks:
        get:
            tags:
                - WebhookService
            description: ListWebhooks lists the organization's endpoints, without secrets.
            operationId: WebhookService_ListWebhooks
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.ListWebhooksResponse'
        post:
            tags:
                - WebhookService
            description: CreateWebhook registers an https endpoint; the secret is returned once.
            operationId: WebhookService_CreateWebhook
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.payments.v1.CreateWebhookRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.Webhook'
    /v1/webhooks/{id}:
        delete:
            tags:
                - WebhookService
            description: DeleteWebhook removes an endpoint; its pending deliveries are dropped.
            operationId: WebhookService_DeleteWebhook
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.DeleteWebhookResponse'
    /v1/webhooks/{id}/deliveries:
        get:
            tags:
                - WebhookService
            description: ListWebhookDeliveries is an endpoint's delivery log.
            operationId: WebhookService_ListWebhookDeliveries
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.payments.v1.ListWebhookDeliveriesResponse'
components:
    schemas:
        api.payments.v1.Account:
            type: object
            properties:
                organizationId:
                    type: string
                organizationName:
                    type: string
                account:
                    type: string
                bankId:
                    type: string
                bankName:
                    type: string
                routingNumber:
                    type: string
                balance:
                    $ref: '#/components/schemas/api.payments.v1.Money'
                inFlight:
                    $ref: '#/components/schemas/api.payments.v1.Money'
                asOf:
                    type: string
                    format: date-time
        api.payments.v1.Alert:
            type: object
            properties:
                id:
                    type: string
                kind:
                    type: string
                message:
                    type: string
                open:
                    type: boolean
                at:
                    type: string
                    format: date-time
        api.payments.v1.ApproveDefundRequest:
            type: object
            properties:
                id:
                    type: string
        api.payments.v1.ApprovePaymentRequest:
            type: object
            properties:
                id:
                    type: string
        api.payments.v1.CancelPaymentRequest:
            type: object
            properties:
                id:
                    type: string
        api.payments.v1.CreatePaymentRequest:
            type: object
            properties:
                debtorAccount:
                    type: string
                creditor:
                    $ref: '#/components/schemas/api.payments.v1.Party'
                amount:
                    $ref: '#/components/schemas/api.payments.v1.Money'
                priority:
                    type: string
                remittance:
                    type: string
                endToEndId:
                    type: string
        api.payments.v1.CreatePaymentResponse:
            type: object
            properties:
                payment:
                    $ref: '#/components/schemas/api.payments.v1.Payment'
                duplicateRequest:
                    type: boolean
                    description: |-
                        True when the Idempotency-Key matched an earlier request with the same
                         body: nothing new was created.
        api.payments.v1.CreateWebhookRequest:
            type: object
            properties:
                url:
                    type: string
        api.payments.v1.DeclinePaymentRequest:
            type: object
            properties:
                id:
                    type: string
                reason:
                    type: string
        api.payments.v1.Defund:
            type: object
            properties:
                id:
                    type: string
                amount:
                    $ref: '#/components/schemas/api.payments.v1.Money'
                requestedBy:
                    type: string
                approvedBy:
                    type: string
                status:
                    type: string
                createdAt:
                    type: string
                    format: date-time
        api.payments.v1.DeleteWebhookResponse:
            type: object
            properties: {}
        api.payments.v1.DistributeInterestRequest:
            type: object
            properties:
                amount:
                    $ref: '#/components/schemas/api.payments.v1.Money'
        api.payments.v1.Document:
            type: object
            properties:
                messageType:
                    type: string
                xml:
                    type: string
            description: Document is an ISO 20022 message rendered as XML.
        api.payments.v1.DrawIntradayRequest:
            type: object
            properties:
                amount:
                    $ref: '#/components/schemas/api.payments.v1.Money'
        api.payments.v1.DrawIntradayResponse:
            type: object
            properties:
                draw:
                    $ref: '#/components/schemas/api.payments.v1.IntradayDraw'
                paymentsReleased:
                    type: integer
                    format: int32
        api.payments.v1.FileRejection:
            type: object
            properties:
                endToEndId:
                    type: string
                reasonCode:
                    type: string
                message:
                    type: string
        api.payments.v1.FundSettlementRequest:
            type: object
            properties:
                amount:
                    $ref: '#/components/schemas/api.payments.v1.Money'
        api.payments.v1.FundSettlementResponse:
            type: object
            properties:
                instrument:
                    type: string
                status:
                    type: string
                reason:
                    type: string
                paymentsReleased:
                    type: integer
                    format: int32
        api.payments.v1.HoldDecisionRequest:
            type: object
            properties:
                id:
                    type: string
                note:
                    type: string
        api.payments.v1.InterestDistribution:
            type: object
            properties:
                id:
                    type: string
                at:
                    type: string
                    format: date-time
                runBy:
                    type: string
                amount:
                    $ref: '#/components/schemas/api.payments.v1.Money'
                paid:
                    $ref: '#/components/schemas/api.payments.v1.Money'
                retained:
                    $ref: '#/components/schemas/api.payments.v1.Money'
                shares:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/api.payments.v1.Money'
        api.payments.v1.IntradayDraw:
            type: object
            properties:
                id:
                    type: string
                principal:
