tags:
    - name: AccountService
      description: AccountService is the corporate client's view of its deposit account.
    - name: BankOperationsService
      description: |-
        BankOperationsService is a member bank's operations console: sanctions
         review (compliance), settlement money and its funding, intraday liquidity
         (treasury), and defunds under maker-checker.
    - name: NetworkOperationsService
      description: |-
        NetworkOperationsService is the operator's console: members' settlement
         money, the Fed reserve account against the token's reserve pool, the
         intraday pool, netting cycles, reconciliation and reserve interest.
    - name: PaymentService
      description: |-
        PaymentService is the corporate client's payment channel: create payment
         orders (singly, or as an ISO 20022 pain.001 file), approve them under
         maker-checker, follow their pain.002 status, and check a payee first.

         CreatePayment and SubmitPaymentFile require an Idempotency-Key header
         (gRPC metadata idempotency-key): a retry with the same key and body
         returns the original result; the same key with a different body is 422.
    - name: WebhookService
      description: |-
        WebhookService manages an organization's payment status notifications.
         Each status change of a payment is delivered as a CloudEvents 1.0 event,
         signed per Standard Webhooks (webhook-id, webhook-timestamp,
         webhook-signature: v1,<base64 HMAC-SHA256 of "id.timestamp.body">), at
         least once and in order per endpoint, retried with backoff. Only the
         organization's approvers manage endpoints.
