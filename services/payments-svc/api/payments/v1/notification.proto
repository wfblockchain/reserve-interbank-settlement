syntax = "proto3";

package api.payments.v1;

option go_package = "reserve-interbank-settlement/services/payments-svc/api/payments/v1;paymentsv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// WebhookService manages an organization's payment status notifications.
// Each status change of a payment is delivered as a CloudEvents 1.0 event,
// signed per Standard Webhooks (webhook-id, webhook-timestamp,
// webhook-signature: v1,<base64 HMAC-SHA256 of "id.timestamp.body">), at
// least once and in order per endpoint, retried with backoff. Only the
// organization's approvers manage endpoints.
service WebhookService {
  // CreateWebhook registers an https endpoint; the secret is returned once.
  rpc CreateWebhook(CreateWebhookRequest) returns (Webhook) {
    option (google.api.http) = { post: "/v1/webhooks" body: "*" };
  }

  // ListWebhooks lists the organization's endpoints, without secrets.
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse) {
    option (google.api.http) = { get: "/v1/webhooks" };
  }

  // DeleteWebhook removes an endpoint; its pending deliveries are dropped.
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse) {
    option (google.api.http) = { delete: "/v1/webhooks/{id}" };
  }

  // ListWebhookDeliveries is an endpoint's delivery log.
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse) {
    option (google.api.http) = { get: "/v1/webhooks/{id}/deliveries" };
  }
}

message CreateWebhookRequest {
  string url = 1;
}

message Webhook {
  string id = 1;
  string url = 2;
  string secret = 3; // whsec_…; only in the CreateWebhook answer
  google.protobuf.Timestamp created_at = 4;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
}

message DeleteWebhookRequest {
  string id = 1;
}

message DeleteWebhookResponse {}

message ListWebhookDeliveriesRequest {
  string id = 1;
}

message WebhookDelivery {
  string id = 1;          // webhook-id; stable across retries
  string event_type = 2;  // payment.<status> | payment.credited
  string status = 3;      // PENDING | DELIVERED | FAILED
  int32 attempts = 4;
  int32 last_response_code = 5;
  string last_error = 6;
  google.protobuf.Timestamp next_attempt_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
}
